[package]
name = "lib-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "SQLite 基础设施：连接、迁移、事务与错误"
license.workspace = true
repository.workspace = true
publish = false

[features]
# 进程内指标采集（P2.1-003）：只在测试构建启用，正式构建只保留空实现。
# 阈值日志已删除（P2.2-004），因此不再需要 `tracing` 依赖。
metrics = []

[dependencies]
# 迁移账本时间戳与日志。
lib-core = { workspace = true }
# SQLite 驱动与连接池（D-P2-002 / D-P2-003：不启用 `macros`）。
sqlx = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
