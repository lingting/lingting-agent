[package]
name = "bin-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "lingting agent 端到端测试入口"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lib-bin-cli = { workspace = true }
lib-bin-tui = { workspace = true, features = ["testing"] }
lib-core = { workspace = true }
service-core = { workspace = true }
types-core = { workspace = true }
# 契约类型快照校验（`runtime.contract` 等用例）的来源（P2-006 起）。
agent-core = { workspace = true }
# 工具契约与内置工具：`tool.decl` / `tool.builtin.*` 直接在进程内核对工具自述与边界（P3-030）。
agent-tool = { workspace = true }
# MCP 用例：`mcp.config` 直接喂文本核对装载规则；后续批次的 `mcp.*` 用例核对工具发现与调用（P4-018）。
agent-mcp = { workspace = true }
# 进程内用例的装配入口（P2-013 起 holder 归 manager-agent）；`metrics` 让运行时采集指标，
# 运行结束后由测试报告输出快照（P2.1-003）。
manager-agent = { workspace = true, features = ["metrics"] }

anyhow = { workspace = true }
clap = { workspace = true }
framework-http = { workspace = true, features = ["reqwest"] }
# 校对定时任务注册（间隔与常量一致），见 `cases/runtime.rs` 的 `runtime.scan`。
framework-timer = { workspace = true }
framework-proc-core = { workspace = true, features = ["ts", "rust"] }
futures-util = { workspace = true }
# 「0001 时代」旧库夹具：`persist.migration` 要先造一个只跑过 0001 的库再让服务端补 0002（R-6）。
sqlx = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "process"] }

[lints]
workspace = true
