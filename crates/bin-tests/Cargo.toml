[package]
name = "bin-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "lingting agent 端到端测试入口"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lib-bin-cli = { workspace = true }
lib-bin-tui = { workspace = true, features = ["testing"] }
lib-core = { workspace = true }
service-core = { workspace = true }
types-core = { workspace = true }
# 契约类型快照校验（`runtime.contract` 等用例）的来源（P2-006 起）。
agent-core = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
framework-http = { workspace = true, features = ["reqwest"] }
# 校对定时任务注册（间隔与常量一致），见 `cases/runtime.rs` 的 `runtime.scan`。
framework-timer = { workspace = true }
framework-proc-core = { workspace = true, features = ["ts", "rust"] }
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "process"] }

[lints]
workspace = true
