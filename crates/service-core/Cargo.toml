[package]
name = "service-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "通用核心业务服务"
license.workspace = true
repository.workspace = true
publish = false
[features]
# 检查点与恢复的进程内计数（P6A-014）：测试构建启用，正式构建是空实现，不做原子操作。
metrics = []

[dependencies]
lib-core = { workspace = true }
# 契约类型唯一来源（P2-006 起）：会话 / 消息 / Run 与事件。
agent-core = { workspace = true }
# 审计记录与查询载荷（P3-018，D-P3-011）：仅类型层，`agent-tool` 不反向依赖本 Crate。
agent-tool = { workspace = true }
# 持久化：连接池、事务入口与错误来自 `lib-db`，SQL 全部写在 `repository`（P2-010 ~ P2-012）。
lib-db = { workspace = true }
sqlx = { workspace = true }
# `messages.tool_calls` 列的 JSON 文本编解码（P3-017）。
serde_json = { workspace = true }
# 执行端口（`session/driver.rs`）：事件通道、取消信号与 dyn 兼容的 async trait。
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
