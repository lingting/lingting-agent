[package]
name = "service-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "通用核心业务服务"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lib-core = { workspace = true }
types-core = { workspace = true }
# 契约类型唯一来源（P2-006 起）：会话 / 消息 / Run 与事件。
agent-core = { workspace = true }

# Mock 事件流生产任务：定时投递事件 + 用通道向消费方投递事件。
tokio = { workspace = true }

# 运行时定时任务：`#[timer]` 注册与心跳扫描（`runtime/timer.rs`）。
framework-timer = { workspace = true }
framework-proc-timer = { workspace = true }

# 断连通知：纯通知总线，处理链订阅后串行执行（`runtime/handler.rs`）。
framework-bus = { workspace = true }
# 断连处理链与事件文件写失败只记日志，不外泄内部细节。
tracing = { workspace = true }
# 事件文件是一行一条 `RunEvent` 的 JSON（`runtime/journal.rs`）。
serde_json = { workspace = true }

[lints]
workspace = true
