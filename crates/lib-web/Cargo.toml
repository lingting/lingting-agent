[package]
name = "lib-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "服务端 HTTP API"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lib-core = { workspace = true }
lib-web-core = { workspace = true }
service-core = { workspace = true }
types-core = { workspace = true }
# Handler 的会话 / 消息 / Run DTO 来源（P2-006 起）。
agent-core = { workspace = true }

anyhow = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true }
specta = { workspace = true }
# SSE 适配：`WebBody::Stream` 需要 `BoxStream` 与 `Bytes`（`session/stream.rs`）。
bytes = { workspace = true }
futures-util = { workspace = true }
# 下行流的保活定时器与通道接收端（`runtime/stream.rs`）。
tokio = { workspace = true }

framework-proc-auto = { workspace = true, features = ["collect"] }
framework-web = { workspace = true, features = ["collect"] }
framework-web-axum = { workspace = true, features = ["collect"] }
framework-proc-core = { workspace = true, features = ["collect", "ts", "rust"] }


[lints]
workspace = true
