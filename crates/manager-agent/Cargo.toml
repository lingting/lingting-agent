[package]
name = "manager-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Agent 装配、进程内运行时与跨 Service 编排"
license.workspace = true
repository.workspace = true
publish = false

[features]
# 运行时进程内指标（P2.1-003 / P2.2-001）：测试构建启用，正式构建是空实现，
# 也不编 `serde`（快照的序列化只服务于 debug + `metrics` 限定的探针）。
metrics = ["lib-db/metrics", "lib-core/metrics", "agent-mcp/metrics", "dep:serde"]

[dependencies]
lib-core = { workspace = true }
lib-db = { workspace = true }
service-core = { workspace = true }
# Provider 配置的只读承载与模型解析；装配层只持有它，不自己定义模型查找（P2-017）。
agent-route = { workspace = true }
# 事件与 Run / Message / Session 契约类型（`RunEvent`、`Run`）。
agent-core = { workspace = true }
# 客户端连接与会话占用契约（`ClientEvent`、`OccupancyVO` 等）。
types-core = { workspace = true }
# 工具注册表与执行参数：装配期按 `[tools]` 建一次，运行期只读（P3-014）。
agent-tool = { workspace = true }
# MCP 门面：装配期建一次并接入注册表，运行期由管理接口驱动（P4-011）。
agent-mcp = { workspace = true }

anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# 事件文件是一行一条 `RunEvent` 的 JSON（`runtime/journal.rs`）。
serde_json = { workspace = true }
# 快照的序列化：只在 `metrics` 特性下启用（P2.2-001）。
serde = { workspace = true, optional = true }
# 断连通知：纯通知总线，处理链订阅后串行执行（`runtime/handler.rs`）。
framework-bus = { workspace = true }
# 运行时定时任务：`#[timer]` 注册与心跳扫描（`runtime/timer.rs`）。
framework-timer = { workspace = true }
framework-proc-timer = { workspace = true }

[lints]
workspace = true
